name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/build-mac.yml'

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Download bundled installers
        run: |
          mkdir -p bundled
          BASE="https://github.com/tardin2005-netizen/winmac/releases/download/v1-installers"
          curl -fsSL -o bundled/kaspersky-mac.dmg  "$BASE/kaspersky-mac.dmg"  || echo "kaspersky-mac.dmg não encontrado, continuando"
          curl -fsSL -o bundled/clickshare-mac.dmg "$BASE/clickshare-mac.dmg" || echo "clickshare-mac.dmg não encontrado, continuando"

      - name: Build macOS DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"
        run: npm run build:mac

      - name: List build output
        run: ls -lh dist/ || echo "Pasta dist/ vazia ou não criada"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: winmac-mac-dmg
          path: dist/*.dmg
          if-no-files-found: warn
